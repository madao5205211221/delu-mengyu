name: 打包安卓 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装依赖
        run: npm install --ignore-scripts

      - name: 构建网页
        run: npm run build

      - name: 同步到安卓工程
        run: npx cap sync android

      - name: 缓存 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 校验包名一致性
        run: |
          set -e
          APPID=$(node -p "require('./capacitor.config.json').appId")
          echo "capacitor.config.json appId = $APPID"
          NS=$(grep -oP 'namespace\s*=\s*"\K[^"]+' android/app/build.gradle | head -1)
          echo "build.gradle namespace   = $NS"
          PKG=$(grep -oP '^package\s+\K[^;]+' android/app/src/main/java/*/*/*/MainActivity.java | head -1)
          echo "MainActivity package     = $PKG"
          DIR=$(find android/app/src/main/java -name MainActivity.java | sed 's|.*/java/||; s|/MainActivity.java||; s|/|.|g')
          echo "MainActivity 所在目录     = $DIR"
          if [ "$APPID" != "$NS" ] || [ "$APPID" != "$PKG" ] || [ "$APPID" != "$DIR" ]; then
            echo "❌ 包名不一致，装到手机上会闪退（ClassNotFoundException）"
            exit 1
          fi
          echo "✅ 包名四处一致：$APPID"

          ACT=$(tr '\n' ' ' < android/app/src/main/AndroidManifest.xml | grep -oP '<activity[^>]*android:name="\K[^"]+' | head -1)
          echo "Manifest 启动 Activity  = $ACT"
          case "$ACT" in
            .MainActivity) echo "✅ 相对写法，自动解析为 $APPID.MainActivity" ;;
            "$APPID.MainActivity") echo "✅ 全名写法，与包名一致" ;;
            *) echo "❌ Manifest 里的启动 Activity 指向 $ACT，与 $APPID.MainActivity 不符，会闪退"; exit 1 ;;
          esac

      - name: 赋予 gradlew 执行权限
        run: chmod +x android/gradlew

      - name: 取出签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/delu-mengyu.p12
            printf 'storeFile=delu-mengyu.p12\nstoreType=PKCS12\nstorePassword=delu-mengyu2026\nkeyAlias=delumengyu\nkeyPassword=delu-mengyu2026\n' > android/keystore.properties
            echo "已配置正式签名，密钥校验值："
            md5sum android/app/delu-mengyu.p12
            ls -l android/app/delu-mengyu.p12
          else
            echo "没有密钥，退回调试签名"
          fi

      - name: 编译 Release APK
        run: cd android && ./gradlew assembleRelease

      - name: 改名
        run: cp android/app/build/outputs/apk/release/app-release.apk delu-mengyu.apk

      - name: 发布到 Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" \
            delu-mengyu.apk \
            --title "得鹿梦鱼 APK 第 ${{ github.run_number }} 次构建" \
            --notes "正式签名版，可直接覆盖安装升级，数据不会丢。自动打包自 commit ${{ github.sha }}"
