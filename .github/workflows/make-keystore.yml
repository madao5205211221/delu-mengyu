name: 生成签名密钥（只用一次）

on:
  workflow_dispatch:

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 生成 keystore
        run: |
          keytool -genkeypair -v \
            -keystore delu-mengyu.jks \
            -alias delumengyu \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass delumengyu2026 -keypass delumengyu2026 \
            -storetype JKS \
            -dname "CN=Delu Mengyu, OU=Personal, O=Luke, C=CN"

      - name: 上传 keystore
        uses: actions/upload-artifact@v4
        with:
          name: delu-mengyu-keystore
          path: delu-mengyu.jks
          retention-days: 1
