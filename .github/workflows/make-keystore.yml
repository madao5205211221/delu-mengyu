name: 生成签名密钥（只用一次）

on:
  workflow_dispatch:

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 生成 keystore
        run: |
          keytool -genkeypair -v \
            -keystore delu-mengyu.p12 \
            -alias delumengyu \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storetype PKCS12 \
            -storepass delu-mengyu2026 -keypass delu-mengyu2026 \
            -dname "CN=Delu Mengyu, OU=Personal, O=Luke, C=CN"

      - name: 当场验证密码能否打开
        run: |
          echo "=== 文件信息 ==="
          ls -l delu-mengyu.p12
          md5sum delu-mengyu.p12
          echo "=== keytool -list ==="
          keytool -list -v \
            -keystore delu-mengyu.p12 \
            -storetype PKCS12 \
            -storepass delu-mengyu2026 \
            -alias delumengyu | head -20

      - name: 上传 keystore
        uses: actions/upload-artifact@v4
        with:
          name: delu-mengyu-keystore
          path: delu-mengyu.p12
          retention-days: 1
